spring.application.name=enterprise-inventory-platform

server.port=${SERVER_PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.hikari.pool-name=InventoryHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=3000ms
spring.data.redis.connect-timeout=3000ms

spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

server.error.include-message=always
server.error.include-binding-errors=always

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.cache.product-ttl-seconds=600
app.cache.product-list-ttl-seconds=120
app.cache.category-ttl-seconds=1800

app.logging.slow-request-threshold-ms=500

logstash.host=${LOGSTASH_HOST}
logstash.port=${LOGSTASH_PORT}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

logging.level.root=INFO
logging.level.com.csj.inventory=DEBUG
logging.level.org.hibernate.SQL=WARN