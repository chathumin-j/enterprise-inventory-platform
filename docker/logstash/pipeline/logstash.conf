input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {

  if [application] {

    mutate {
      add_field => {
        "[@metadata][index_prefix]" => "%{application}"
      }
    }

  } else {

    mutate {
      add_field => {
        "[@metadata][index_prefix]" => "inventory-platform"
      }
    }

  }

  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

}

output {

  elasticsearch {

    hosts => ["http://elasticsearch:9200"]

    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"

  }

  stdout {
    codec => rubydebug
  }

}